</style></head><body><div id="app"></div><div id="toast" hidden></div>
<script>
//DEF-START
const COPY={ brand: "RANDOMLOCKE", brandSub: "OWNER DASHBOARD", navRules: "Reglas", navMatches: "Combates", navRanking: "Posiciones", navGods: "Dioses", navPrivate: "Zona privada", heroKicker: "TABLERO DE RUN · GENERACIÓN ALEATORIA", publicTag: "Vista pública", playersTag: "jugadores", noWeek: "Sin semana", visualLabel: "VISUAL DE LA RUN", visualCaption: "Randomlocke Pokémon", soundtrackLabel: "BANDA SONORA", statPlayers: "Jugadores", statMatches: "Combates cargados", statResults: "Resultados", statDeaths: "Bajas totales", todayInProgress: "EN CURSO", todayPlanned: "PLANIFICADO", todayLimit: "Límite de hoy", todayNext: "Próximo límite", rulesEyebrow: "Reglamento de la run", rulesTitle: "Reglas", matchesEyebrow: "Calendario competitivo", matchesTitle: "Combates de la semana", rankingEyebrow: "Rendimiento de la run", rankingTitle: "Posiciones", godsEyebrow: "Salón de la fama", godsTitle: "Dioses de Locke", godsDescription: "Cada semana la comunidad elige sus Pokémon favoritos. No necesitás iniciar sesión para votar.", godsVoteButton: "Votar por este Pokémon", godsEmpty: "Todavía no hay candidatos para esta semana", deathsEyebrow: "Estado de la caja", deathsTitle: "Muertes por jugador", ownerKicker: "ZONA PRIVADA", ownerTitle: "Editor completo de la run", ownerDescription: "Todo lo que guardes aquí queda persistido en la base de datos.", footerLeft: "RANDOMLOCKE · OWNER DASHBOARD", footerRight: "Contenido público + zona privada protegida", accessNotice: "Tu cuenta puede consultar el dashboard, pero la zona privada requiere un correo autorizado por el propietario.", matchLabel: "COMBATE", matchResult: "RESULTADO", matchPending: "PENDIENTE", vs: "VS", tableRank: "#", tablePlayer: "Jugador", tableWins: "Ganadas", tableLosses: "Perdidas", deathPlayer: "JUGADOR", noLimit: "Todavía no hay un límite definido", addDatePrompt: "Agregá una fecha desde la zona privada.", checkingSession: "Comprobando sesión…", loginButton: "Iniciar sesión", logoutButton: "Salir", loadingText: "Ca const CF=[
  ["brand", "Marca"], ["brandSub", "Submarca"], ["navRules", "Menú: reglas"], ["navMatches", "Menú: combates"], ["navRanking", "Menú: posiciones"], ["navGods", "Menú: dioses"], ["navPrivate", "Menú: zona privada"], ["heroKicker", "Kicker de portada"], ["publicTag", "Etiqueta pública"], ["playersTag", "Etiqueta jugadores"], ["noWeek", "Sin semana"], ["visualLabel", "Etiqueta de imagen"], ["visualCaption", "Texto de imagen"], ["soundtrackLabel", "Etiqueta de música"], ["statPlayers", "Estadística jugadores"], ["statMatches", "Estadística combates"], ["statResults", "Estadística resultados"], ["statDeaths", "Estadística bajas"], ["todayInProgress", "Límite en curso"], ["todayPlanned", "Límite planificado"], ["todayLimit", "Límite de hoy"], ["todayNext", "Próximo límite"], ["rulesEyebrow", "Reglas: etiqueta"], ["rulesTitle", "Reglas: título"], ["matchesEyebrow", "Combates: etiqueta"], ["matchesTitle", "Combates: título"], ["rankingEyebrow", "Posiciones: etiqueta"], ["rankingTitle", "Posiciones: título"], ["godsEyebrow", "Dioses: etiqueta"], ["godsTitle", "Dioses: título"], ["godsDescription", "Dioses: descripción"], ["godsVoteButton", "Dioses: botón de voto"], ["godsEmpty", "Dioses: estado vacío"], ["deathsEyebrow", "Bajas: etiqueta"], ["deathsTitle", "Bajas: título"], ["ownerKicker", "Editor: etiqueta"], ["ownerTitle", "Editor: título"], ["ownerDescription", "Editor: descripción"], ["footerLeft", "Pie izquierdo"], ["footerRight", "Pie derecho"], ["accessNotice", "Aviso de acceso"], ["matchLabel", "Combate"], ["matchResult", "Resultado"], ["matchPending", "Pendiente"], ["vs", "VS"], ["tableRank", "Tabla: número"], ["tablePlayer", "Tabla: jugador"], ["tableWins", "Tabla: ganadas"], ["tableLosses", "Tabla: perdidas"], ["deathPlayer", "Etiqueta de jugador"], ["noLimit", "Sin límite"], ["addDatePrompt", "Aviso sin fecha"], ["checkingSession", "Comprobando sesión"], ["loginButton", "Botón iniciar sesión"], ["logoutButton", "Botón salir"], ["loadingText", "Mensaje de carga"], ["audioFallback", "Aviso de audio"]
];
COPY.godsDescription="Los Pokémon más destacados de cada semana, calificados por el propietario.";
COPY.ownerDescription="Los cambios quedan como borrador en este navegador. Exportá data.json y subilo al repositorio para publicarlos.";
COPY.footerRight="Página estática · editable solo por el propietario";
const DEF={title:"Randomlocke Pokémon",sub:"Reglas, combates y capturas de la run",copy:COPY,
rules:["Cada Pokémon (salvaje, entrenadores, starters) está randomizado.","Solo podés capturar el primer Pokémon de cada ruta.","Si un Pokémon se debilita, queda muerto y va a la caja.","Todos los Pokémon llevan apodo."],
heroUrl:null,music:[],players:Array.from({length:14},(_,i)=>({name:"Jugador "+(i+1),imageUrl:null})),gods:[],
weeks:[{n:"Semana 1",m:[[3,8],[10,12],[1,6],[5,9],[11,7],[2,0],[4,13]].map(([a,b])=>({a,b,w:""}))}],
deaths:Array(14).fill(0),days:[{d:"2026-09-28",t:"Ejemplo: hasta el Gimnasio 1"}]};
//DEF-END
const LS="randomlocke-draft-v1",$=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>"&#"+c.charCodeAt(0)+";");
let run,editing=/edit/.test(location.hash+location.search),godWeek=null,musIdx=0,animated=false,tt,sv;
const norm=d=>({...structuredClone(DEF),...d,copy:{...COPY,...(d.copy||{})}});
const toast=m=>{const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2800)};
const save=()=>{clearTimeout(sv);sv=setTimeout(()=>{try{localStorage.setItem(LS,JSON.stringify(run))}catch{toast("Borrador muy pesado: exportá data.json y usá URLs para las imágenes")}},300)};
const setP=(o,p,v)=>{const k=p.split("."),l=k.pop();k.reduce((a,x)=>a[x],o)[l]=v};
const fmt=d=>new Date(d+"T12:00:00").toLocaleDateString("es-UY",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
const av=(p,s="small")=>!p?`<span class="player-avatar ${s}">?</span>`:p.imageUrl?`<img class="player-avatar ${s}" src="${esc(p.imageUrl)}" alt="${esc(p.name)}">`:`<span class="player-avatar ${s}">${esc(p.name.split(" ").map(x=>x[0]).join("").slice(0,2).toUpperCase())}</span>`;
const head=(e,t,i,n)=>`<div class="section-heading"><div><p class="eyebrow">${esc(e)}</p><h2>${i} ${esc(t)}</h2></div>${n?`<span class="count-pill">${esc(n)}</span>`:""}</div>`;
const ytId=u=>(u.match(/(?:youtu\.be\/|v=|embed\/|shorts\/|live\/)([\w-]{6,20})/)||[])[1];
const trackEl=t=>{const y=ytId(t.url);return y?`<iframe src="https://www.youtube.com/embed/${y}?rel=0" allow="encrypted-media" allowfullscreen loading="lazy"></iframe>`:`<audio controls loop preload="none" src="${esc(t.url)}"></audio>`};

function view(){
const c=run.copy,wk=run.weeks[run.weeks.length-1]||{n:c.noWeek,m:[]},tm=run.weeks.reduce((s,w)=>s+w.m.length,0),pm=run.weeks.reduce((s,w)=>s+w.m.filter(m=>m.w).length,0),td=run.deaths.reduce((s,v)=>s+v,0);
const today=new Date().toLocaleDateString("sv"),days=[...run.days].sort((a,b)=>a.d.localeCompare(b.d)),cur=days.find(d=>d.d===today),nxt=cur||days.find(d=>d.d>today)||days[days.length-1];
const st=run.players.map((p,i)=>({i,p,w:0,l:0}));
run.weeks.forEach(w=>w.m.forEach(m=>{const a=st[m.a],b=st[m.b];if(!a||!b)return;if(m.w=="a"){a.w++;b.l++}if(m.w=="b"){b.w++;a.l++}}));
st.sort((a,b)=>b.w-a.w||a.l-b.l||a.i-b.i);
const gw=godWeek||wk.n,gods=run.gods.filter(g=>g.week==gw).sort((a,b)=>b.score-a.score).slice(0,10),gn=[...new Set([...run.weeks.map(w=>w.n),...run.gods.map(g=>g.week)])];
const tr=run.music||[],t=tr[musIdx]||tr[0];
const stat=(i,l,v,k,n)=>`<article class="stat-card ${k}"><div class="stat-icon">${i}</div><span>${esc(l)}</span><strong ${n?`data-count="${v}"`:""}>${v}</strong></article>`;
return `<div class="site-shell"><header class="topbar"><a class="brand" href="#top"><span class="brand-mark">🔥</span><span><b>${esc(c.brand)}</b><small>${esc(c.brandSub)}</small></span></a><nav class="topnav"><a href="#rules">${esc(c.navRules)}</a><a href="#matches">${esc(c.navMatches)}</a><a href="#ranking">${esc(c.navRanking)}</a><a href="#gods">${esc(c.navGods)}</a>${editing?`<a class="owner-link" href="#owner-zone">🔒 ${esc(c.navPrivate)}</a>`:""}</nav></header>
<main id="top" class="page-content"><section class="hero-panel"><div class="hero-copy"><p class="kicker"><span class="live-dot"></span> ${esc(c.heroKicker)}</p><h1>${esc(run.title)}</h1><p class="hero-subtitle">${esc(run.sub)}</p><div class="hero-tags"><span>👁 ${esc(c.publicTag)}</span><span>👥 ${run.players.length} ${esc(c.playersTag)}</span><span>⚔ ${esc(wk.n)}</span></div></div><div class="hero-emblem" aria-hidden="true"><div class="pokeball"><span></span></div></div></section>
${run.heroUrl?`<figure class="visual-card"><img src="${esc(run.heroUrl)}" alt="Imagen principal de la run"><figcaption><span><span class="caption-dot"></span> ${esc(c.visualLabel)}</span><span>${esc(c.visualCaption)} · ${esc(wk.n)}</span></figcaption></figure>`:""}
${t?`<section class="music-player"><div class="music-player-title"><span class="music-disc">♪</span><span><small>${esc(c.soundtrackLabel)}</small><strong>${esc(t.name)}</strong></span></div>${tr.length>1?`<select id="trk">${tr.map((x,i)=>`<option value="${i}" ${x==t?"selected":""}>${esc(x.name)}</option>`).join("")}</select>`:""}${trackEl(t)}</section>`:""}
<section class="stats-grid">${stat("👥",c.statPlayers,run.players.length,"blue",1)}${stat("⚔",c.statMatches,tm,"orange",1)}${stat("✅",c.statResults,pm+"/"+tm,"green")}${stat("💀",c.statDeaths,td,"pink",1)}</section>
<section class="today-card"><div class="today-meta"><span>🗓 ${esc(cur?c.todayLimit:c.todayNext)}</span><b>${esc(cur?c.todayInProgress:c.todayPlanned)}</b></div><h2>${esc(nxt?.t||c.noLimit)}</h2><p>${nxt?fmt(nxt.d):esc(c.addDatePrompt)}</p></section>
<section id="rules" class="content-card">${head(c.rulesEyebrow,c.rulesTitle,"🔑",run.rules.length+" reglas")}<div class="rules-grid">${run.rules.map((r,i)=>`<article class="rule-card"><span>${String(i+1).padStart(2,"0")}</span><p>${esc(r)}</p></article>`).join("")}</div></section>
<section id="matches" class="content-card">${head(c.matchesEyebrow,c.matchesTitle,"⚔",wk.n)}<div class="matches-grid">${wk.m.map((m,i)=>{const a=run.players[m.a],b=run.players[m.b];return `<article class="match-card"><div class="match-top"><span>${esc(c.matchLabel)} ${String(i+1).padStart(2,"0")}</span><b class="${m.w?"done":""}">${esc(m.w?c.matchResult:c.matchPending)}</b></div><div class="match-line"><span class="match-player">${av(a)}<strong class="${m.w=="a"?"winner":m.w=="b"?"loser":""}">${esc(a?.name||"Jugador")}</strong></span><i>${esc(c.vs)}</i><span class="match-player">${av(b)}<strong class="${m.w=="b"?"winner":m.w=="a"?"loser":""}">${esc(b?.name||"Jugador")}</strong></span></div></article>`}).join("")}</div></section>
<section id="ranking" class="content-card">${head(c.rankingEyebrow,c.rankingTitle,"🏆",st.length+" jugadores")}<div class="table-wrap"><table><thead><tr><th>${esc(c.tableRank)}</th><th>${esc(c.tablePlayer)}</th><th>${esc(c.tableWins)}</th><th>${esc(c.tableLosses)}</th></tr></thead><tbody>${st.map((s,i)=>`<tr><td><span class="rank ${i<3?"podium":""}">${i<3?["🥇","🥈","🥉"][i]:i+1}</span></td><td><span class="table-player">${av(s.p)}${esc(s.p.name)}</span></td><td><span class="win-score">${s.w}</span><span class="score-bar"><i style="width:${Math.min(100,s.w*28)}%"></i></span></td><td>${s.l}</td></tr>`).join("")}</tbody></table></div></section>
<section id="gods" class="content-card gods-section">${head(c.godsEyebrow,c.godsTitle,"✦",gods.length?gods.length+" candidatos":"sin calificar")}<p class="section-intro">${esc(c.godsDescription)}</p><div class="god-week-tabs">${gn.map(w=>`<button class="${w==gw?"active":""}" data-gw="${esc(w)}">${esc(w)}</button>`).join("")}</div>${gods.length?`<div class="gods-grid">${gods.map((g,k)=>{const s=Math.max(0,Math.min(10,g.score));return `<article class="god-card"><div class="god-rank">${k+1}</div><div class="god-art">${g.imageUrl?`<img src="${esc(g.imageUrl)}" alt="${esc(g.pokemon)}">`:"<span>✦</span>"}</div><div class="god-copy"><div class="god-topline"><span>${esc(run.players[g.playerIndex]?.name||"Participante")}</span><b>${s}/10</b></div><h3>${esc(g.pokemon)}</h3>${g.note?`<p>${esc(g.note)}</p>`:""}<div class="god-stars">${"★".repeat(s)}<i>${"★".repeat(10-s)}</i></div></div></article>`}).join("")}</div>`:`<div class="empty-gods"><strong>${esc(c.godsEmpty)} · ${esc(gw)}</strong></div>`}</section>
<section class="content-card">${head(c.deathsEyebrow,c.deathsTitle,"💀","total "+td)}<div class="deaths-grid">${run.players.map((p,i)=>`<div class="death-card"><span class="death-player">${av(p)}<span><small>${esc(c.deathPlayer)}</small>${esc(p.name)}</span></span><b>💀 ${run.deaths[i]||0}</b></div>`).join("")}</div></section>
${editing?editor():""}</main><footer><span>${esc(c.footerLeft)}</span><span>${esc(c.footerRight)}</span></footer></div>`}

const inp=(p,v,x="")=>`<input data-p="${p}" value="${esc(v)}" ${x}>`;

const upl=k=>`<label class="upload-mini">📷<input type="file" accept="image/*" data-up="${k}"></label>`;
const blk=(t,add,body,x="")=>`<div class="editor-block ${x}"><div class="editor-title"><span>${t}</span>${add||""}</div>${body}</div>`;

function editor(){
const c=run.copy,pl=run.players.map((p,i)=>[i,p.name]),wn=run.weeks.map(w=>[w.n,w.n]);
return `<section id="owner-zone" class="owner-panel"><div class="owner-header"><div><p class="kicker">🔒 ${esc(c.ownerKicker)}</p><h2>👑 ${esc(c.ownerTitle)}</h2><p>${esc(c.ownerDescription)}</p></div></div>
<div class="owner-editor-toolbar"><div><strong>Modo edición</strong><span>Borrador guardado en este navegador</span></div><span style="display:flex;gap:8px;flex-wrap:wrap"><label class="secondary-button">Importar JSON<input id="imp" type="file" accept=".json" hidden></label><button class="secondary-button" data-a="reset">Descartar borrador</button><button class="primary-button" data-a="export">⬇ Exportar data.json</button></span></div>
<div class="full-editor-grid">
${blk("Identidad de la run","",`<label>Título${inp("title",run.title)}</label><label>Subtítulo${inp("sub",run.sub)}</label><label>Imagen principal (URL, ruta del repo o subir)${inp("heroUrl",run.heroUrl||"",'placeholder="img/portada.jpg"')}</label><label class="upload-button">Subir imagen<input type="file" accept="image/*" data-up="hero"></label>${run.heroUrl?`<img class="editor-hero-preview" src="${esc(run.heroUrl)}" alt="">`:""}`)}
${blk("Música",`<button class="small-action" data-a="addTrack">+ Pista</button>`,`<p class="editor-hint">Enlace de YouTube o URL/ruta de un MP3 (ej: music/tema.mp3).</p>${(run.music||[]).map((t,i)=>`<div class="inline-editor">${inp(`music.${i}.name`,t.name,'placeholder="Nombre"')}${inp(`music.${i}.url`,t.url,'placeholder="https://youtube.com/…"')}${btn("delTrack",i)}</div>`).join("")}`)}
${blk("Reglas",btn("addRule","","","+","icon-button"),`<div class="stack-editor">${run.rules.map((r,i)=>`<div class="inline-editor"><span>${String(i+1).padStart(2,"0")}</span>${inp(`rules.${i}`,r)}${btn("delRule",i)}</div>`).join("")}</div>`)}
${blk("Jugadores, avatares y bajas",`<button class="small-action" data-a="addPlayer">+ Jugador</button>`,`<div class="player-editor-grid">${run.players.map((p,i)=>`<div class="player-editor-card"><div class="player-editor-top">${av(p,"large")}${upl("player:"+i)}${btn("delPlayer",i)}</div>${inp(`players.${i}.name`,p.name)}${inp(`players.${i}.imageUrl`,p.imageUrl||"",'placeholder="URL de imagen"')}<div class="death-ctl"><small>Bajas</small>${btn("death",i,-1,"−","icon-button")}<b>${run.deaths[i]||0}</b>${btn("death",i,1,"+","icon-button")}</div></div>`).join("")}</div>`,"editor-span")}
${blk("Dioses de Locke",`<button class="small-action" data-a="addGod">+ Calificación</button>`,`<div class="gods-editor">${run.gods.map((g,i)=>`<div class="god-editor-row">${sel(`gods.${i}.week`,wn,g.week)}${sel(`gods.${i}.playerIndex`,pl,g.playerIndex,1)}${inp(`gods.${i}.pokemon`,g.pokemon,'placeholder="Pokémon"')}${num(`gods.${i}.score`,g.score,'min="1" max="10"')}${inp(`gods.${i}.note`,g.note,'placeholder="Por qué fue un dios…"')}${inp(`gods.${i}.imageUrl`,g.imageUrl||"",'placeholder="URL de imagen"')}${upl("god:"+i)}${btn("delGod",i)}</div>`).join("")}</div>`,"editor-span")}
${blk("Semanas y combates",`<button class="small-action" data-a="addWeek">+ Semana</button>`,`<div class="weeks-editor">${run.weeks.map((w,wi)=>`<div class="week-editor"><div class="week-editor-head">${inp(`weeks.${wi}.n`,w.n)}${btn("delWeek",wi)}</div>${w.m.map((m,mi)=>`<div class="match-editor"><span>#${mi+1}</span>${sel(`weeks.${wi}.m.${mi}.a`,pl,m.a,1)}<b>${esc(c.vs)}</b>${sel(`weeks.${wi}.m.${mi}.b`,pl,m.b,1)}${sel(`weeks.${wi}.m.${mi}.w`,[["","Pendiente"],["a","Gana A"],["b","Gana B"]],m.w)}${btn("delMatch",wi,mi,"−")}</div>`).join("")}<button class="add-line" data-a="addMatch" data-i="${wi}">+ Agregar combate</button></div>`).join("")}</div>`,"editor-span")}
${blk("Límites y fechas",`<button class="small-action" data-a="addDay">+ Límite</button>`,`<div class="days-editor">${run.days.map((d,i)=>`<div class="day-editor"><input type="date" data-p="days.${i}.d" value="${esc(d.d)}">${inp(`days.${i}.t`,d.t,'placeholder="Descripción del límite"')}${btn("delDay",i)}</div>`).join("")}</div>`,"editor-span")}
${blk("Todos los textos del sitio","",`<div class="copy-grid">${CF.map(([k,l])=>`<label>${esc(l)}${inp("copy."+k,c[k])}</label>`).join("")}</div>`,"editor-span copy-editor")}
${blk("Notas locales",`<b>SOLO ESTE NAVEGADOR</b>`,`<textarea id="notes" rows="6" placeholder="No se exportan ni se publican">${esc(localStorage.getItem(LS+"-notes")||"")}</textarea>`,"vault-editor")}
</div><div class="owner-foot">🔒 Para publicar: exportá data.json y reemplazalo en el repositorio de GitHub.</div></section>`}

const A={
addRule(){run.rules.push("Nueva regla")},delRule(i){run.rules.splice(i,1)},
addTrack(){(run.music=run.music||[]).push({name:"Nueva pista",url:""})},delTrack(i){run.music.splice(i,1);musIdx=0},
addPlayer(){run.players.push({name:"Jugador "+(run.players.length+1),imageUrl:null});run.deaths.push(0)},
delPlayer(i){if(run.players.length<=2)return;const r=v=>v>i?v-1:v;run.players.splice(i,1);run.deaths.splice(i,1);run.weeks.forEach(w=>w.m=w.m.filter(m=>m.a!=i&&m.b!=i).map(m=>({...m,a:r(m.a),b:r(m.b)})));run.gods=run.gods.filter(g=>g.playerIndex!=i).map(g=>({...g,playerIndex:r(g.playerIndex)}))},
death(i,d){run.deaths[i]=Math.max(0,(run.deaths[i]||0)+d)},
addGod(){run.gods.push({week:run.weeks[run.weeks.length-1].n,playerIndex:0,pokemon:"Nuevo Pokémon",score:10,note:"",imageUrl:null})},delGod(i){run.gods.splice(i,1)},
addWeek(){run.weeks.push({n:"Semana "+(run.weeks.length+1),m:[]})},delWeek(i){if(run.weeks.length>1)run.weeks.splice(i,1)},
addMatch(i){run.weeks[i].m.push({a:0,b:1,w:""})},delMatch(i,j){run.weeks[i].m.splice(j,1)},
addDay(){run.days.push({d:new Date().toLocaleDateString("sv"),t:"Nuevo límite"})},delDay(i){run.days.splice(i,1)}};

const img2url=(f,max)=>new Promise((ok,ko)=>{const r=new FileReader();r.onerror=ko;r.onload=()=>{const i=new Image();i.onerror=ko;i.onload=()=>{const s=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);ok(c.toDataURL("image/webp",.85))};i.src=r.result};r.readAsDataURL(f)});

document.addEventListener("click",e=>{
const g=e.target.closest("[data-gw]");if(g){godWeek=g.dataset.gw;render();return}
const t=e.target.closest("[data-a]");if(!t)return;const{a,i,j}=t.dataset;
if(a=="export"){const b=new Blob([JSON.stringify(run,null,1)],{type:"application/json"}),l=document.createElement("a");l.href=URL.createObjectURL(b);l.download="data.json";l.click();return}
if(a=="reset"){if(confirm("¿Descartar el borrador y volver a data.json?")){localStorage.removeItem(LS);location.reload()}return}
A[a]?.(+i,+j);save();render()});
document.addEventListener("input",e=>{const t=e.target;if(t.id=="notes")localStorage.setItem(LS+"-notes",t.value);else if(t.dataset.p){setP(run,t.dataset.p,t.hasAttribute("data-n")?Number(t.value):t.value);save()}});
document.addEventListener("change",async e=>{const t=e.target;
if(t.id=="trk"){musIdx=+t.value;render()}
else if(t.id=="imp"&&t.files[0]){try{run=norm(JSON.parse(await t.files[0].text()));save();render();toast("JSON importado")}catch{toast("JSON inválido")}}
else if(t.dataset.up&&t.files[0]){const[k,i]=t.dataset.up.split(":");try{const u=await img2url(t.files[0],k=="hero"?1400:256);if(k=="hero")run.heroUrl=u;else if(k=="player")run.players[i].imageUrl=u;else run.gods[i].imageUrl=u;save();render()}catch{toast("No se pudo leer la imagen")}}
else if(t.dataset.p)render()});

function fx(){if(animated)return;animated=true;
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.08});
document.querySelectorAll(".content-card,.stat-card,.rule-card,.match-card,.god-card,.death-card,.today-card").forEach((el,i)=>{el.classList.add("rv");el.style.transitionDelay=(i%6)*45+"ms";io.observe(el)});
document.querySelectorAll("[data-count]").forEach(el=>{const n=+el.dataset.count,t0=performance.now(),f=t=>{const p=Math.min(1,(t-t0)/900);el.textContent=Math.round(n*p*(2-p));if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)})}
function render(){document.title=run.title;$("#app").innerHTML=view();fx()}
(async()=>{let base=DEF;try{const r=await fetch("data.json",{cache:"no-store"});if(r.ok)base=await r.json()}catch{}
run=norm(base);if(editing)try{const s=localStorage.getItem(LS);if(s)run=norm(JSON.parse(s))}catch{}
render()})();
</script></body></html>
